name: DataPass Edge X Feeds release-candidate checks
on:
  pull_request:
    branches: [feat/visual-library-edge-entry-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  x-feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - run: node --check extension/x-feeds-model.mjs
      - run: node --check extension/x-feeds.mjs
      - name: Isolated Chromium screenshot smoke
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.55.1
          npx playwright install --with-deps chromium
          node scripts/browser-x-feeds-smoke.mjs
      - name: Upload source checkout for release pack assembly
        run: |
          mkdir -p artifacts/source
          tar czf artifacts/source/edge-x-feeds-source.tar.gz --exclude=.git --exclude=node_modules --exclude=artifacts .
          printf '%s\n' "${GITHUB_SHA}" > artifacts/source/checked-out-git-sha.txt
      - name: Preserve synthetic and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-x-feeds-qualification
          path: |
            artifacts/x-feeds/*.png
            artifacts/source/*.tar.gz
            artifacts/source/checked-out-git-sha.txt
          if-no-files-found: ignore
          retention-days: 7
